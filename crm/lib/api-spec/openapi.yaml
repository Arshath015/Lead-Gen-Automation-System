              schema:
                $ref: "#/components/schemas/DealRevenueEntry"
    delete:
      operationId: deleteDealRevenueEntry
      tags: [deals]
      summary: Delete a revenue entry
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
