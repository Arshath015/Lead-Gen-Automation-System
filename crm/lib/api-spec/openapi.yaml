        duplicateFileWarning:
          type: ["string", "null"]
          description: Set if file hash matches a previous import
        lowConfidenceColumns:
          type: array
          items:
            type: string
          description: Column names with confidence < 60% requiring manual review

    ValidateImportBody:
      type: object
      required: [rows, mappings]
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/ImportColumnMapping"

    ValidateDuplicateEntry:
      type: object
      required: [rowNum, field, value]
      properties:
        rowNum:
          type: integer
        field:
          type: string
        value:
          type: string
        existingId:
          type: ["integer", "null"]
        existingCompany:
          type: ["string", "null"]

    ValidateErrorEntry:
      type: object
      required: [rowNum, field, message]
      properties:
        rowNum:
          type: integer
        field:
          type: string
        message:
          type: string

    ValidateImportResult:
      type: object
      required: [totalRows, uniqueRows, duplicateRows, invalidRows, duplicates, validationErrors]
      properties:
        totalRows:
          type: integer
        uniqueRows:
          type: integer
        duplicateRows:
          type: integer
        invalidRows:
          type: integer
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/ValidateDuplicateEntry"
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/ValidateErrorEntry"

    ImportJobSummary:
      type: object
      required: [id, status, totalRows, importedRows, skippedRows, updatedRows, failedRows, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: ["integer", "null"]
        userId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, importing, complete, failed, rolled_back]
        fileName:
          type: ["string", "null"]
        fileHash:
          type: ["string", "null"]
        totalRows:
          type: integer
        importedRows:
          type: integer
        skippedRows:
          type: integer
        updatedRows:
          type: integer
        failedRows:
          type: integer
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        rollbackedAt:
          type: ["string", "null"]
        canRollback:
          type: boolean
          description: True if import is complete and has not been rolled back

    ImportMappingTemplate:
      type: object
      required: [id, name, mappings, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: ["integer", "null"]
        name:
          type: string
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/ImportColumnMapping"
        createdAt:
          type: string

    CreateImportMappingTemplateBody:
      type: object
      required: [name, mappings]
      properties:
        name:
          type: string
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/ImportColumnMapping"

    # Web-to-lead
    WebToLeadBody:
      type: object
      required: [companyName, contactPerson, token]
      properties:
        token:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: Workspace-scoped token obtained from the generated public form link.
        companyName:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        industry:
          type: string
        message:
          type: string
        website_field:
          type: string
          description: Honeypot field — must be empty
