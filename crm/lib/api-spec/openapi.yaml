  /email-templates:
    get:
      operationId: listEmailTemplates
      tags: [email-templates]
      summary: List email templates (active only by default; admins can pass includeInactive=true)
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of email templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"
    post:
      operationId: createEmailTemplate
      tags: [email-templates]
