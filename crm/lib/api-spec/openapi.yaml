  /leads/{leadId}/send-email:
    post:
      operationId: sendLeadEmail
      tags: [leads]
      summary: Send an email to a lead and log it as an activity
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailInput"
      responses:
        "200":
          description: Email sent and logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"

  # Public web-to-lead form
  /public/leads:
    post:
      operationId: submitWebToLead
      tags: [public]
      summary: Submit web-to-lead form using a workspace token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebToLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        "401":
          description: Missing, invalid, or replaced workspace token

  /workspaces/current/web-to-lead-token:
    post:
      operationId: provisionWebToLeadToken
      tags: [workspaces]
      summary: Generate or replace the authenticated admin's workspace form token
      description: Requires an authenticated workspace admin with settings.edit permission. Replaces any previous link.
      responses:
        "201":
          description: Newly generated token (returned only once)
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    description: 256-bit random token; use only in the public form URL fragment.
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /imports/analyze:
    post:
      operationId: analyzeImport
      tags: [imports]
      summary: Analyze file headers and sample data for AI-assisted field mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeImportBody"
      responses:
        "200":
          description: Column analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeImportResult"

  /imports/validate:
    post:
      operationId: validateImport
      tags: [imports]
      summary: Validate rows and detect duplicates before import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateImportBody"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateImportResult"

  /imports:
    get:
      operationId: listImportJobs
      tags: [imports]
      summary: List recent import jobs for the workspace
      responses:
        "200":
          description: Import job history
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportJobSummary"

  /imports/mapping-templates:
    get:
      operationId: listImportMappingTemplates
      tags: [imports]
      summary: List saved mapping templates for the workspace
      responses:
        "200":
          description: Mapping templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportMappingTemplate"
    post:
      operationId: createImportMappingTemplate
      tags: [imports]
      summary: Save a reusable field mapping template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportMappingTemplateBody"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMappingTemplate"

  /imports/mapping-templates/{id}:
    delete:
      operationId: deleteImportMappingTemplate
      tags: [imports]
      summary: Delete a mapping template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /imports/{id}/rollback:
    post:
      operationId: rollbackImport
      tags: [imports]
      summary: Rollback a completed import — deletes all leads created by that job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rollback result
          content:
            application/json:
              schema:
                type: object
                required: [deletedLeads]
                properties:
                  deletedLeads:
                    type: integer

  /imports/{id}/error-report:
    get:
      operationId: getImportErrorReport
      tags: [imports]
      summary: Download CSV of failed rows for a completed import job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

